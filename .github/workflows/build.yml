name: MSYS2
on: [push, pull_request]

jobs:
  msys2-ucrt64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-git mingw-w64-ucrt-x86_64-gcc
      - name: Update MINGW repositories
        run: |
          pacman -Syu --noconfirm
      - name: Install MINGW dependencies
        run: |
          pacman -Su --noconfirm
          pacman -S --noconfirm base-devel mingw-w64-x86_64-toolchain git python ninja
          pacman -S --noconfirm mingw-w64-x86_64-glib2 mingw-w64-x86_64-pixman python-setuptools mingw-w64-ucrt-x86_64-python-sphinx mingw-w64-ucrt-x86_64-meson
          pacman -S --noconfirm mingw-w64-x86_64-gtk3 mingw-w64-x86_64-SDL2 mingw-w64-ucrt-x86_64-libslirp
      - name: CI-Build
        run: |
          mkdir build
          cd build
          ../configure
          make -j2
